# ============================================================
# USER SERVICE — DEV PROFILE
# ============================================================
server.port=8081
spring.application.name=user-service

spring.datasource.url=jdbc:h2:mem:userdb_dev
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.com.microservices=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Custom app properties — change these to test hot reload via busrefresh
app.environment=dev
app.message=User Service running in DEVELOPMENT mode
app.feature.registration-enabled=true
app.max-users=50
app.debug-mode=true
