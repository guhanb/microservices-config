spring:
    datasource:
      url: jdbc:postgresql://${USER_DB_HOST}:${USER_DB_PORT:5432}/userdb
      username: ${USER_DB_USERNAME}
      password: ${USER_DB_PASSWORD}
    jpa:
      database: POSTGRESQL
      show-sql: false
      hibernate:
        ddl-auto: validate
      database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
    port: 8082
