# ============================================================
# USER SERVICE — DEFAULT CONFIG
# Served by Config Server from GitHub
# ============================================================
server.port=8081
spring.application.name=user-service

# H2 Database
spring.datasource.url=jdbc:h2:mem:userdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# App custom properties (used to test hot reload)
app.environment=default
app.message=User Service running in DEFAULT mode
app.feature.registration-enabled=true
app.max-users=100
