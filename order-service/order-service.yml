spring:
    datasource:
      url: jdbc:postgresql://${ORDER_DB_HOST}:${ORDER_DB_PORT:5432}/orderdb
      username: ${ORDER_DB_USERNAME}
      password: ${ORDER_DB_PASSWORD}
    jpa:
      database: POSTGRESQL
      show-sql: false
      hibernate:
        ddl-auto: validate
      database-platform: org.hibernate.dialect.PostgreSQLDialect

  server:
    port: 8083
